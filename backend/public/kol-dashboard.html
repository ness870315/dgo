<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOL Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow-lg p-6">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-3xl font-bold text-gray-800">KOL Dashboard</h1>
                <div class="flex gap-2">
                    <button onclick="reanalyzeTweets()" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700">
                        Re-analyze Tweets
                    </button>
                    <button onclick="showAddKOLModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
                        Add KOL
                    </button>
                </div>
            </div>

            <!-- Insights Summary -->
            <div id="insights" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <!-- Insights will be loaded here -->
            </div>

            <!-- KOLs List -->
            <div id="kolsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-8">
                <!-- KOLs will be loaded here -->
            </div>

            <!-- Posts List -->
            <div class="bg-gray-50 rounded-lg p-4">
                <h2 class="text-xl font-semibold mb-4">Recent Posts</h2>
                <div id="postsList">
                    <!-- Posts will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Add KOL Modal -->
    <div id="addKOLModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
        <div class="bg-white p-6 rounded-lg shadow-xl w-full max-w-md">
            <h3 class="text-xl font-semibold mb-4">Add New KOL</h3>
            <input id="kolHandle" type="text" placeholder="@username" class="w-full px-3 py-2 border rounded-lg mb-4">
            <div class="flex gap-2">
                <button onclick="addKOL()" class="flex-1 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">
                    Add KOL
                </button>
                <button onclick="hideAddKOLModal()" class="px-4 py-2 border rounded-lg hover:bg-gray-50">
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <script>
        // Global state
        let kols = [];
        let posts = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
        });

        // Load data
        async function loadData() {
            try {
                // Load KOLs
                const kolsResponse = await fetch('/api/kol/kols');
                const kolsResult = await kolsResponse.json();
                
                if (kolsResult.success) {
                    kols = kolsResult.data;
                    updateKOLsList();
                } else {
                    console.error('Failed to load KOLs:', kolsResult.error);
                }

                // Load posts
                const postsResponse = await fetch('/api/kol/posts');
                const postsResult = await postsResponse.json();
                
                if (postsResult.success) {
                    posts = postsResult.data;
                    updateInsights();
                    updatePostsList();
                } else {
                    console.error('Failed to load posts:', postsResult.error);
                }

            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        // Update insights summary
        function updateInsights() {
            const container = document.getElementById('insights');
            
            if (posts.length === 0) {
                container.innerHTML = '';
                return;
            }

            // Calculate insights
            const coinMentions = {};
            const narrativeMentions = {};
            let bullishCount = 0;
            let bearishCount = 0;
            let neutralCount = 0;

            posts.forEach(post => {
                // Count coins
                if (post.coins) {
                    post.coins.forEach(coin => {
                        coinMentions[coin] = (coinMentions[coin] || 0) + 1;
                    });
                }

                // Count narratives
                if (post.narratives) {
                    post.narratives.forEach(narrative => {
                        narrativeMentions[narrative] = (narrativeMentions[narrative] || 0) + 1;
                    });
                }

                // Count sentiment
                if (post.sentiment > 0) bullishCount++;
                else if (post.sentiment < 0) bearishCount++;
                else neutralCount++;
            });

            // Top coins
            const topCoins = Object.entries(coinMentions)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 5)
                .map(([coin, count]) => `<span class="text-sm">${coin} (${count})</span>`)
                .join(', ') || 'None yet';

            // Top narratives
            const topNarratives = Object.entries(narrativeMentions)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 3)
                .map(([narrative, count]) => `<span class="text-sm">${narrative} (${count})</span>`)
                .join(', ') || 'None yet';

            // Overall sentiment
            const totalSentiment = bullishCount + bearishCount + neutralCount;
            const sentimentText = totalSentiment > 0 
                ? `📈 ${Math.round(bullishCount/totalSentiment*100)}% | ➡️ ${Math.round(neutralCount/totalSentiment*100)}% | 📉 ${Math.round(bearishCount/totalSentiment*100)}%`
                : 'No data';

            container.innerHTML = `
                <div class="bg-blue-50 border border-blue-200 rounded-lg p-4">
                    <h3 class="font-semibold text-blue-900 mb-2">Top Coins</h3>
                    <div class="text-blue-700">${topCoins}</div>
                </div>
                <div class="bg-purple-50 border border-purple-200 rounded-lg p-4">
                    <h3 class="font-semibold text-purple-900 mb-2">Top Narratives</h3>
                    <div class="text-purple-700">${topNarratives}</div>
                </div>
                <div class="bg-green-50 border border-green-200 rounded-lg p-4">
                    <h3 class="font-semibold text-green-900 mb-2">Overall Sentiment</h3>
                    <div class="text-green-700">${sentimentText}</div>
                </div>
            `;
        }

        // Update KOLs list
        function updateKOLsList() {
            const container = document.getElementById('kolsList');
            
            if (kols.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center text-gray-500 py-8">
                        <p class="mb-4">No KOLs added yet</p>
                        <button onclick="showAddKOLModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
                            Add Your First KOL
                        </button>
                    </div>
                `;
                return;
            }

            container.innerHTML = kols.map(kol => `
                <div class="bg-white border rounded-lg p-4 shadow-sm">
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="font-semibold">@${kol.handle}</h3>
                        <button onclick="deleteKOL('${kol.handle}')" class="text-red-600 hover:text-red-800">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                    <p class="text-sm text-gray-600">Posts: ${kol.total_posts}</p>
                    <p class="text-sm text-gray-600">Last fetched: ${kol.last_fetched ? new Date(kol.last_fetched).toLocaleString() : 'Never'}</p>
                    <p class="text-xs text-gray-500">Added: ${new Date(kol.created_at).toLocaleDateString()}</p>
                </div>
            `).join('');

            // Initialize Lucide icons
            lucide.createIcons();
        }

        // Update posts list
        function updatePostsList() {
            const container = document.getElementById('postsList');
            
            if (posts.length === 0) {
                container.innerHTML = '<p class="text-gray-500">No posts yet</p>';
                return;
            }

            // Show recent posts (last 10)
            const recentPosts = posts
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
                .slice(0, 10);

            container.innerHTML = recentPosts.map(post => {
                const sentimentIcon = post.sentiment > 0 ? '📈' : post.sentiment < 0 ? '📉' : '➡️';
                const sentimentColor = post.sentiment > 0 ? 'text-green-600' : post.sentiment < 0 ? 'text-red-600' : 'text-gray-600';
                const coinsDisplay = post.coins && post.coins.length > 0 
                    ? `<div class="flex gap-1 mb-2">${post.coins.map(coin => `<span class="px-2 py-1 bg-blue-100 text-blue-800 text-xs rounded-full">${coin}</span>`).join('')}</div>`
                    : '';
                const narrativesDisplay = post.narratives && post.narratives.length > 0 
                    ? `<div class="flex gap-1 mb-2">${post.narratives.map(n => `<span class="px-2 py-1 bg-purple-100 text-purple-800 text-xs rounded-full">${n}</span>`).join('')}</div>`
                    : '';
                
                return `
                    <div class="bg-white border rounded-lg p-3 mb-3">
                        <div class="flex justify-between items-start mb-2">
                            <span class="font-semibold text-blue-600">@${post.kol_handle}</span>
                            <span class="text-xs text-gray-500">${new Date(post.created_at).toLocaleString()}</span>
                        </div>
                        <p class="text-sm mb-2">${post.text}</p>
                        ${coinsDisplay}
                        ${narrativesDisplay}
                        <div class="flex gap-4 text-xs text-gray-500">
                            <span class="${sentimentColor} font-semibold">${sentimentIcon} ${post.sentiment > 0 ? 'Bullish' : post.sentiment < 0 ? 'Bearish' : 'Neutral'}</span>
                            <span>❤️ ${post.likes}</span>
                            <span>🔄 ${post.retweets}</span>
                            <span>💬 ${post.replies}</span>
                            <span>👀 ${post.views}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Show add KOL modal
        function showAddKOLModal() {
            document.getElementById('addKOLModal').classList.remove('hidden');
            document.getElementById('kolHandle').focus();
        }

        // Hide add KOL modal
        function hideAddKOLModal() {
            document.getElementById('addKOLModal').classList.add('hidden');
            document.getElementById('kolHandle').value = '';
        }

        // Add KOL
        async function addKOL() {
            const handle = document.getElementById('kolHandle').value.trim();
            
            if (!handle) {
                alert('Please enter a Twitter handle');
                return;
            }

            // Disable button to prevent double-clicks
            const button = event.target;
            button.disabled = true;
            button.textContent = 'Adding...';

            try {
                const response = await fetch('/api/kol/kols', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ handle })
                });

                const result = await response.json();
                
                if (result.success) {
                    alert('KOL added successfully! Fetching tweets...');
                    hideAddKOLModal();
                    loadData(); // Reload data
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                alert('Error adding KOL: ' + error.message);
            } finally {
                // Re-enable button
                button.disabled = false;
                button.textContent = 'Add KOL';
            }
        }

        // Delete KOL
        async function deleteKOL(handle) {
            if (!confirm(`Are you sure you want to delete @${handle}?`)) {
                return;
            }

            try {
                const response = await fetch(`/api/kol/kols/${handle}`, {
                    method: 'DELETE'
                });

                const result = await response.json();
                
                if (result.success) {
                    alert('KOL deleted successfully!');
                    loadData(); // Reload data
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                alert('Error deleting KOL: ' + error.message);
            }
        }

        // Re-analyze all tweets
        async function reanalyzeTweets() {
            if (!confirm('This will analyze all tweets that haven\'t been analyzed yet. Continue?')) {
                return;
            }

            try {
                const response = await fetch('/api/kol/reanalyze', {
                    method: 'POST'
                });

                const result = await response.json();
                
                if (result.success) {
                    alert(`Success! Re-analyzed ${result.message}`);
                    loadData(); // Reload data to show updated insights
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                alert('Error re-analyzing tweets: ' + error.message);
            }
        }
    </script>
</body>
</html>
