<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOL API Test</title>
</head>
<body>
    <h1>KOL API Test</h1>
    <div id="output"></div>
    
    <script>
        async function testAPI() {
            const output = document.getElementById('output');
            
            try {
                console.log('Testing KOL API...');
                
                const response = await fetch('/api/kolsentiment/kols');
                console.log('Response:', response);
                
                const data = await response.json();
                console.log('Data:', data);
                
                if (data.success) {
                    output.innerHTML = `
                        <h2>✅ API Success</h2>
                        <p>Total KOLs: ${data.data.total}</p>
                        <h3>KOLs:</h3>
                        <ul>
                            ${data.data.kols.map(kol => `
                                <li>
                                    <strong>@${kol.handle}</strong> 
                                    (Influence: ${kol.influence_score}/100)
                                    <br>Posts: ${kol.total_posts || 0}
                                    <br>Reliability: ${(kol.reliability_score || 0).toFixed(1)}
                                    <br>Created: ${new Date(kol.created_at).toLocaleString()}
                                </li>
                            `).join('')}
                        </ul>
                    `;
                } else {
                    output.innerHTML = `<h2>❌ API Error</h2><p>${data.error}</p>`;
                }
                
            } catch (error) {
                console.error('Error:', error);
                output.innerHTML = `<h2>💥 Fetch Error</h2><p>${error.message}</p>`;
            }
        }
        
        // Run test when page loads
        testAPI();
    </script>
</body>
</html>
