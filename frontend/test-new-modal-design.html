<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test New Modal Design</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            margin: 0;
            padding: 40px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .test-button {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .test-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 40px;
        }
        
        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-50px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    </style>
</head>
<body>
    <h1>🧪 Test New Modal Design</h1>
    <p style="color: white; text-align: center; margin-bottom: 30px;">
        Click the buttons below to test the new professional modal designs
    </p>
    
    <button class="test-button" onclick="showSuccessModal()">
        🎉 Test Success Modal
    </button>
    
    <button class="test-button" onclick="showErrorModal()">
        ❌ Test Error Modal
    </button>
    
    <button class="test-button" onclick="showOldAlert()">
        👻 Old Ugly Alert (for comparison)
    </button>

    <script>
        // Professional Success Modal Function
        const showProfessionalSuccessModal = (tokenData) => {
            // Create modal overlay
            const overlay = document.createElement('div');
            overlay.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.8);
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 10000;
                backdrop-filter: blur(4px);
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            `;

            // Create modal content
            const modal = document.createElement('div');
            modal.style.cssText = `
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                border-radius: 20px;
                padding: 40px;
                max-width: 500px;
                width: 90%;
                text-align: center;
                color: white;
                box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
                position: relative;
                animation: modalSlideIn 0.3s ease-out;
            `;

            modal.innerHTML = `
                <div style="margin-bottom: 30px;">
                    <div style="font-size: 60px; margin-bottom: 20px;">🎉</div>
                    <h2 style="margin: 0; font-size: 28px; font-weight: 700; margin-bottom: 10px;">
                        Token Listed Successfully!
                    </h2>
                    <p style="margin: 0; font-size: 18px; opacity: 0.9;">
                        ${tokenData.name} (${tokenData.symbol}) is being processed by DeGen Oracle.
                    </p>
                </div>

                <div style="background: rgba(255, 255, 255, 0.1); border-radius: 15px; padding: 25px; margin-bottom: 30px;">
                    <div style="display: flex; align-items: center; justify-content: center; margin-bottom: 20px;">
                        <div style="font-size: 24px; margin-right: 10px;">⏱️</div>
                        <span style="font-size: 16px; font-weight: 600;">Processing Time: Approximately 2-3 minutes</span>
                    </div>
                    
                    <div style="text-align: left; margin-bottom: 20px;">
                        <div style="font-size: 18px; font-weight: 600; margin-bottom: 15px; text-align: center;">
                            📊 DeGen Oracle is calculating:
                        </div>
                        <div style="display: grid; gap: 8px; font-size: 14px;">
                            <div style="display: flex; align-items: center;">
                                <span style="margin-right: 8px;">•</span>
                                <span>Market metrics and price data</span>
                            </div>
                            <div style="display: flex; align-items: center;">
                                <span style="margin-right: 8px;">•</span>
                                <span>Community sentiment scores</span>
                            </div>
                            <div style="display: flex; align-items: center;">
                                <span style="margin-right: 8px;">•</span>
                                <span>Social media presence</span>
                            </div>
                            <div style="display: flex; align-items: center;">
                                <span style="margin-right: 8px;">•</span>
                                <span>Overall ranking position</span>
                            </div>
                        </div>
                    </div>
                </div>

                <button id="successModalOK" style="
                    background: rgba(255, 255, 255, 0.2);
                    border: 2px solid rgba(255, 255, 255, 0.3);
                    color: white;
                    padding: 12px 30px;
                    border-radius: 25px;
                    font-size: 16px;
                    font-weight: 600;
                    cursor: pointer;
                    transition: all 0.3s ease;
                    backdrop-filter: blur(10px);
                " onmouseover="this.style.background='rgba(255, 255, 255, 0.3)'" 
                   onmouseout="this.style.background='rgba(255, 255, 255, 0.2)'">
                    OK
                </button>
            `;

            overlay.appendChild(modal);
            document.body.appendChild(overlay);

            // Handle OK button click
            document.getElementById('successModalOK').onclick = () => {
                document.body.removeChild(overlay);
                
                // In real app, this would redirect to main page
                console.log('🏠 Would redirect to main page: ' + window.location.origin);
                alert('✅ In the real app, this would redirect to the main page!');
            };

            // Handle overlay click to close
            overlay.onclick = (e) => {
                if (e.target === overlay) {
                    document.body.removeChild(overlay);
                    
                    // In real app, this would redirect to main page
                    console.log('🏠 Would redirect to main page: ' + window.location.origin);
                    alert('✅ In the real app, this would redirect to the main page!');
                }
            };
        };

        // Professional Error Modal Function
        const showProfessionalErrorModal = (message) => {
            // Create modal overlay
            const overlay = document.createElement('div');
            overlay.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.8);
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 10000;
                backdrop-filter: blur(4px);
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            `;

            // Create modal content
            const modal = document.createElement('div');
            modal.style.cssText = `
                background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
                border-radius: 20px;
                padding: 40px;
                max-width: 400px;
                width: 90%;
                text-align: center;
                color: white;
                box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
                position: relative;
                animation: modalSlideIn 0.3s ease-out;
            `;

            modal.innerHTML = `
                <div style="margin-bottom: 30px;">
                    <div style="font-size: 60px; margin-bottom: 20px;">❌</div>
                    <h2 style="margin: 0; font-size: 24px; font-weight: 700; margin-bottom: 15px;">
                        Error
                    </h2>
                    <p style="margin: 0; font-size: 16px; opacity: 0.9; line-height: 1.4;">
                        ${message}
                    </p>
                </div>

                <button id="errorModalOK" style="
                    background: rgba(255, 255, 255, 0.2);
                    border: 2px solid rgba(255, 255, 255, 0.3);
                    color: white;
                    padding: 12px 30px;
                    border-radius: 25px;
                    font-size: 16px;
                    font-weight: 600;
                    cursor: pointer;
                    transition: all 0.3s ease;
                    backdrop-filter: blur(10px);
                " onmouseover="this.style.background='rgba(255, 255, 255, 0.3)'" 
                   onmouseout="this.style.background='rgba(255, 255, 255, 0.2)'">
                    OK
                </button>
            `;

            overlay.appendChild(modal);
            document.body.appendChild(overlay);

            // Handle OK button click
            document.getElementById('errorModalOK').onclick = () => {
                document.body.removeChild(overlay);
            };

            // Handle overlay click to close
            overlay.onclick = (e) => {
                if (e.target === overlay) {
                    document.body.removeChild(overlay);
                }
            };
        };

        // Test functions
        function showSuccessModal() {
            showProfessionalSuccessModal({
                name: "MEMEPUTER",
                symbol: "MEMEPUTER"
            });
        }

        function showErrorModal() {
            showProfessionalErrorModal("This is a test error message to show how the new error modal looks compared to the old ugly alert.");
        }

        function showOldAlert() {
            alert("🎉 Token Listed Successfully!\n\nmemeputer (MEMEPUTER) is being processed by DeGen Oracle.\n\n⏱️ Processing Time: Approximately 2-3 minutes\n\n📊 DeGen Oracle is calculating:\n• Market metrics and price data\n• Community sentiment scores\n• Social media presence\n• Overall ranking position");
        }
    </script>
</body>
</html>
