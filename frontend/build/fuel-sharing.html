<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 Fuel Sharing - Degen Oracle</title>
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://degen-oracle.com/fuel-sharing.html">
    <meta property="og:title" content="🔥 Fuel Sharing - Degen Oracle">
    <meta property="og:description" content="Someone just fueled a token on Degen Oracle! The degen army is assembling! 🚀">
    <meta property="og:image" content="https://api.degen-oracle.com/api/fuel-image/10x/EXAMPLE">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:alt" content="Fuel Sharing Image">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@dgnoracle">
    <meta name="twitter:creator" content="@dgnoracle">
    <meta name="twitter:url" content="https://degen-oracle.com/fuel-sharing.html">
    <meta name="twitter:title" content="🔥 Fuel Sharing - Degen Oracle">
    <meta name="twitter:description" content="Someone just fueled a token on Degen Oracle! The degen army is assembling! 🚀">
    <meta name="twitter:image" content="https://api.degen-oracle.com/api/fuel-image/10x/EXAMPLE">
    <meta name="twitter:image:alt" content="Fuel Sharing Image">
    <meta name="twitter:domain" content="degen-oracle.com">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 600px;
            color: #333;
        }
        .fuel-image {
            max-width: 100%;
            height: auto;
            border-radius: 15px;
            margin: 20px 0;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            font-size: 18px;
            margin-bottom: 30px;
        }
        .cta-button {
            background: linear-gradient(45deg, #ff6b6b, #ffa500);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.2s;
        }
        .cta-button:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="fuel-title">🔥 Fuel Sharing</h1>
        <p class="subtitle" id="fuel-subtitle">Someone just fueled a token on Degen Oracle!</p>
        <img id="fuel-image" src="https://api.degen-oracle.com/api/fuel-image/10x/EXAMPLE" alt="Fuel Sharing" class="fuel-image" onerror="this.style.display='none'">
        <p>The degen army is assembling! 🚀</p>
        <a href="https://degen-oracle.com" class="cta-button">Join the Oracle</a>
    </div>
    
    <script>
        // Extract fuel type and symbol from URL
        const pathParts = window.location.pathname.split('/');
        if (pathParts.length >= 4 && pathParts[1] === 'fuel') {
            const fuelType = pathParts[2];
            const symbol = pathParts[3];
            
            // Update the page content
            document.title = `🔥 ${symbol} ${fuelType} Fuel - Degen Oracle`;
            document.getElementById('fuel-title').textContent = `🔥 ${symbol} ${fuelType} Fuel`;
            document.getElementById('fuel-subtitle').textContent = `Someone just fueled #${symbol} with ${fuelType} boost on Degen Oracle!`;
            
            // Update meta tags
            const imageUrl = `https://api.degen-oracle.com/api/fuel-image/${fuelType}/${symbol}`;
            document.getElementById('fuel-image').src = imageUrl;
            document.getElementById('fuel-image').alt = `${symbol} ${fuelType} Fuel`;
            
            // Update Open Graph meta tags
            document.querySelector('meta[property="og:url"]').setAttribute('content', `https://degen-oracle.com/fuel/${fuelType}/${symbol}`);
            document.querySelector('meta[property="og:title"]').setAttribute('content', `🔥 ${symbol} ${fuelType} Fuel - Degen Oracle`);
            document.querySelector('meta[property="og:description"]').setAttribute('content', `Someone just fueled #${symbol} with ${fuelType} boost on Degen Oracle! The degen army is assembling! 🚀`);
            document.querySelector('meta[property="og:image"]').setAttribute('content', imageUrl);
            document.querySelector('meta[property="og:image:alt"]').setAttribute('content', `${symbol} ${fuelType} Fuel Image`);
            
            // Update Twitter meta tags
            document.querySelector('meta[name="twitter:url"]').setAttribute('content', `https://degen-oracle.com/fuel/${fuelType}/${symbol}`);
            document.querySelector('meta[name="twitter:title"]').setAttribute('content', `🔥 ${symbol} ${fuelType} Fuel - Degen Oracle`);
            document.querySelector('meta[name="twitter:description"]').setAttribute('content', `Someone just fueled #${symbol} with ${fuelType} boost on Degen Oracle! The degen army is assembling! 🚀`);
            document.querySelector('meta[name="twitter:image"]').setAttribute('content', imageUrl);
            document.querySelector('meta[name="twitter:image:alt"]').setAttribute('content', `${symbol} ${fuelType} Fuel Image`);
        }
        
        // Redirect users to main site after a short delay
        setTimeout(function() {
            window.location.href = 'https://degen-oracle.com';
        }, 2000);
    </script>
</body>
</html>
