<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 Fuel Page - Degen Oracle</title>
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://degen-oracle.com/fuel">
    <meta property="og:title" content="🔥 Fuel Page - Degen Oracle">
    <meta property="og:description" content="Someone just fueled a token on Degen Oracle! The degen army is assembling! 🚀">
    <meta property="og:image" content="https://api.degen-oracle.com/api/fuel-image/10x/TOKEN">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:alt" content="Token Fuel Image">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@dgnoracle">
    <meta name="twitter:creator" content="@dgnoracle">
    <meta name="twitter:url" content="https://degen-oracle.com/fuel">
    <meta name="twitter:title" content="🔥 Fuel Page - Degen Oracle">
    <meta name="twitter:description" content="Someone just fueled a token on Degen Oracle! The degen army is assembling! 🚀">
    <meta name="twitter:image" content="https://api.degen-oracle.com/api/fuel-image/10x/TOKEN">
    <meta name="twitter:image:alt" content="Token Fuel Image">
    <meta name="twitter:domain" content="degen-oracle.com">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 600px;
            color: #333;
        }
        .fuel-image {
            max-width: 100%;
            height: auto;
            border-radius: 15px;
            margin: 20px 0;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            font-size: 18px;
            margin-bottom: 30px;
        }
        .cta-button {
            background: linear-gradient(45deg, #ff6b6b, #ffa500);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.2s;
        }
        .cta-button:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 Token Fuel</h1>
        <p class="subtitle">Someone just fueled a token on Degen Oracle!</p>
        <img id="fuelImage" src="" alt="Token Fuel" class="fuel-image" onerror="this.style.display='none'">
        <p>The degen army is assembling! 🚀</p>
        <a href="https://degen-oracle.com" class="cta-button">Join the Oracle</a>
    </div>
    
    <script>
        // Extract fuel type and symbol from URL
        const pathParts = window.location.pathname.split('/');
        const fuelType = pathParts[2] || '10x';
        const symbol = pathParts[3] || 'TOKEN';
        
        // Update page content dynamically
        document.title = `🔥 ${symbol} ${fuelType} Fuel - Degen Oracle`;
        document.querySelector('h1').textContent = `🔥 ${symbol} ${fuelType} Fuel`;
        document.querySelector('.subtitle').textContent = `Someone just fueled #${symbol} with ${fuelType} boost on Degen Oracle!`;
        
        // Update meta tags
        const imageUrl = `https://api.degen-oracle.com/api/fuel-image/${fuelType}/${symbol}`;
        document.querySelector('meta[property="og:title"]').setAttribute('content', `🔥 ${symbol} ${fuelType} Fuel - Degen Oracle`);
        document.querySelector('meta[property="og:description"]').setAttribute('content', `Someone just fueled #${symbol} with ${fuelType} boost on Degen Oracle! The degen army is assembling! 🚀`);
        document.querySelector('meta[property="og:image"]').setAttribute('content', imageUrl);
        document.querySelector('meta[name="twitter:title"]').setAttribute('content', `🔥 ${symbol} ${fuelType} Fuel - Degen Oracle`);
        document.querySelector('meta[name="twitter:description"]').setAttribute('content', `Someone just fueled #${symbol} with ${fuelType} boost on Degen Oracle! The degen army is assembling! 🚀`);
        document.querySelector('meta[name="twitter:image"]').setAttribute('content', imageUrl);
        
        // Set fuel image
        const fuelImage = document.getElementById('fuelImage');
        fuelImage.src = imageUrl;
        fuelImage.alt = `${symbol} ${fuelType} Fuel`;
        
        // Redirect users to main site, but let bots see the meta tags
        setTimeout(function() {
            window.location.href = 'https://degen-oracle.com/?from=fuel';
        }, 2000);
    </script>
</body>
</html>
