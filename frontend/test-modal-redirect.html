<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Modal Redirect</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            margin: 0;
            padding: 40px;
            min-height: 100vh;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .test-button {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 20px 40px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin: 20px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .test-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        
        .info {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #3b82f6;
            padding: 20px;
            border-radius: 15px;
            margin: 20px;
            text-align: center;
            max-width: 600px;
        }
        
        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-50px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    </style>
</head>
<body>
    <h1>🧪 Test Modal Redirect Functionality</h1>
    
    <div class="info">
        <h3>📋 Test Instructions:</h3>
        <p>Click the button below to show the payment success modal.</p>
        <p><strong>Expected behavior:</strong></p>
        <ul style="text-align: left; display: inline-block;">
            <li>✅ Professional modal appears</li>
            <li>✅ Click "OK" → Redirects to main page</li>
            <li>✅ Click outside modal → Also redirects to main page</li>
        </ul>
    </div>
    
    <button class="test-button" onclick="showTestModal()">
        🎉 Test Payment Success Modal with Redirect
    </button>

    <script>
        // Professional Success Modal Function (with redirect)
        const showProfessionalSuccessModal = (tokenData) => {
            // Create modal overlay
            const overlay = document.createElement('div');
            overlay.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.8);
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 10000;
                backdrop-filter: blur(4px);
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            `;

            // Create modal content
            const modal = document.createElement('div');
            modal.style.cssText = `
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                border-radius: 20px;
                padding: 40px;
                max-width: 500px;
                width: 90%;
                text-align: center;
                color: white;
                box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
                position: relative;
                animation: modalSlideIn 0.3s ease-out;
            `;

            // Add CSS animation
            const style = document.createElement('style');
            style.textContent = `
                @keyframes modalSlideIn {
                    from {
                        opacity: 0;
                        transform: translateY(-50px) scale(0.9);
                    }
                    to {
                        opacity: 1;
                        transform: translateY(0) scale(1);
                    }
                }
            `;
            document.head.appendChild(style);

            modal.innerHTML = `
                <div style="margin-bottom: 30px;">
                    <div style="font-size: 60px; margin-bottom: 20px;">🎉</div>
                    <h2 style="margin: 0; font-size: 28px; font-weight: 700; margin-bottom: 10px;">
                        Payment Successful!
                    </h2>
                    <p style="margin: 0; font-size: 18px; opacity: 0.9;">
                        ${tokenData.name} (${tokenData.symbol}) is being processed by DeGen Oracle.
                    </p>
                </div>

                <div style="background: rgba(255, 255, 255, 0.1); border-radius: 15px; padding: 25px; margin-bottom: 30px;">
                    <div style="display: flex; align-items: center; justify-content: center; margin-bottom: 20px;">
                        <div style="font-size: 24px; margin-right: 10px;">⏱️</div>
                        <span style="font-size: 16px; font-weight: 600;">Processing Time: Approximately 2-3 minutes</span>
                    </div>
                    
                    <div style="text-align: left; margin-bottom: 20px;">
                        <div style="font-size: 18px; font-weight: 600; margin-bottom: 15px; text-align: center;">
                            📊 DeGen Oracle is calculating:
                        </div>
                        <div style="display: grid; gap: 8px; font-size: 14px;">
                            <div style="display: flex; align-items: center;">
                                <span style="margin-right: 8px;">•</span>
                                <span>Market metrics and price data</span>
                            </div>
                            <div style="display: flex; align-items: center;">
                                <span style="margin-right: 8px;">•</span>
                                <span>Community sentiment scores</span>
                            </div>
                            <div style="display: flex; align-items: center;">
                                <span style="margin-right: 8px;">•</span>
                                <span>Social media presence</span>
                            </div>
                            <div style="display: flex; align-items: center;">
                                <span style="margin-right: 8px;">•</span>
                                <span>Overall ranking position</span>
                            </div>
                        </div>
                    </div>
                </div>

                <button id="successModalOK" style="
                    background: rgba(255, 255, 255, 0.2);
                    border: 2px solid rgba(255, 255, 255, 0.3);
                    color: white;
                    padding: 12px 30px;
                    border-radius: 25px;
                    font-size: 16px;
                    font-weight: 600;
                    cursor: pointer;
                    transition: all 0.3s ease;
                    backdrop-filter: blur(10px);
                " onmouseover="this.style.background='rgba(255, 255, 255, 0.3)'" 
                   onmouseout="this.style.background='rgba(255, 255, 255, 0.2)'">
                    OK - Return to Main Page
                </button>
            `;

            overlay.appendChild(modal);
            document.body.appendChild(overlay);

            // Handle OK button click
            document.getElementById('successModalOK').onclick = () => {
                document.body.removeChild(overlay);
                document.head.removeChild(style);
                
                // Show redirect message (in real app this would redirect)
                alert('🏠 Redirecting to main page!\n\nIn the real app, you would now see the main token dashboard where your newly listed token will appear within 2-3 minutes.');
                
                // In real app: window.location.href = window.location.origin;
            };

            // Handle overlay click to close
            overlay.onclick = (e) => {
                if (e.target === overlay) {
                    document.body.removeChild(overlay);
                    document.head.removeChild(style);
                    
                    // Show redirect message (in real app this would redirect)
                    alert('🏠 Redirecting to main page!\n\nIn the real app, you would now see the main token dashboard where your newly listed token will appear within 2-3 minutes.');
                    
                    // In real app: window.location.href = window.location.origin;
                }
            };
        };
        
        function showTestModal() {
            const testTokenData = {
                name: 'MEMEPUTER',
                symbol: 'MEMEPUTER'
            };
            
            showProfessionalSuccessModal(testTokenData);
        }
    </script>
</body>
</html>
